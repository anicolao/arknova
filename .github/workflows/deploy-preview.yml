name: Deploy preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  deployments: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Resolve trusted preview identity
    if: >-
      vars.KENOBI_PREVIEW_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      pr: ${{ steps.identity.outputs.pr }}
      sha: ${{ steps.identity.outputs.sha }}
      source_run_id: ${{ steps.identity.outputs.source_run_id }}
      source_run_attempt: ${{ steps.identity.outputs.source_run_attempt }}
    steps:
      - name: Resolve the PR associated with the completed CI run
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_EVENT" == pull_request ]]
          [[ "$HEAD_REPOSITORY" == "$REPOSITORY" ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

          mapfile -t candidates < <(jq -r --arg sha "$HEAD_SHA" \
            '.workflow_run.pull_requests[] | select(.head.sha == $sha) | .number' \
            "$GITHUB_EVENT_PATH")
          [[ "${#candidates[@]}" == 1 ]]
          pr="${candidates[0]}"
          [[ "$pr" =~ ^[1-9][0-9]*$ ]]
          pull="$(gh api "repos/$REPOSITORY/pulls/$pr")"
          jq -e \
            --arg repository "$REPOSITORY" \
            --arg sha "$HEAD_SHA" \
            '.state == "open" and .head.repo.full_name == $repository and .head.sha == $sha' \
            <<<"$pull" >/dev/null

          {
            echo "pr=$pr"
            echo "sha=$HEAD_SHA"
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "source_run_attempt=$SOURCE_RUN_ATTEMPT"
          } >>"$GITHUB_OUTPUT"

  deploy:
    name: Deploy PR ${{ needs.resolve.outputs.pr }}
    needs: resolve
    runs-on: ubuntu-24.04
    concurrency:
      group: kenobi-preview-pr-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    environment:
      name: kenobi-pr-${{ needs.resolve.outputs.pr }}
      url: https://pr-${{ needs.resolve.outputs.pr }}.arknova.morpheum.dev
    env:
      PREVIEW_URL: https://pr-${{ needs.resolve.outputs.pr }}.arknova.morpheum.dev
      PR_NUMBER: ${{ needs.resolve.outputs.pr }}
      REPOSITORY: ${{ github.repository }}
      SOURCE_RUN_ATTEMPT: ${{ needs.resolve.outputs.source_run_attempt }}
      SOURCE_RUN_ID: ${{ needs.resolve.outputs.source_run_id }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Re-check that the PR still points at this commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          pull="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          if jq -e \
            --arg repository "$REPOSITORY" \
            --arg sha "$SOURCE_SHA" \
            '.state == "open" and .head.repo.full_name == $repository and .head.sha == $sha' \
            <<<"$pull" >/dev/null; then
            echo 'deploy=true' >>"$GITHUB_OUTPUT"
          else
            echo 'The completed CI run is stale; nothing will be deployed.'
            echo 'deploy=false' >>"$GITHUB_OUTPUT"
          fi

      - name: Download the exact CI artifact
        if: steps.current.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir artifact
          gh run download "$SOURCE_RUN_ID" \
            --repo "$REPOSITORY" \
            --name "preview-$PR_NUMBER-$SOURCE_SHA" \
            --dir artifact

      - name: Verify the untrusted deployment artifact
        if: steps.current.outputs.deploy == 'true'
        run: |
          python3 scripts/verify_preview_artifact.py artifact \
            --pr "$PR_NUMBER" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --repository "$REPOSITORY" \
            --sha "$SOURCE_SHA"

      - name: Create GitHub deployment
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployment="$(jq -n \
            --arg ref "$SOURCE_SHA" \
            --arg environment "kenobi-pr-$PR_NUMBER" \
            '{ref: $ref, environment: $environment, transient_environment: true, auto_merge: false, required_contexts: []}' \
            | gh api --method POST "repos/$REPOSITORY/deployments" --input -)"
          deployment_id="$(jq -r '.id' <<<"$deployment")"
          [[ "$deployment_id" =~ ^[1-9][0-9]*$ ]]
          echo "id=$deployment_id" >>"$GITHUB_OUTPUT"
          jq -n \
            --arg environment_url "$PREVIEW_URL" \
            --arg log_url "$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: "in_progress", environment_url: $environment_url, log_url: $log_url, auto_inactive: false}' \
            | gh api --method POST "repos/$REPOSITORY/deployments/$deployment_id/statuses" --input - >/dev/null

      - name: Install the dedicated deployment identity
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.KENOBI_PREVIEW_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_KEY" ]]
          install -m 600 /dev/null "$RUNNER_TEMP/kenobi-preview-key"
          printf '%s\n' "$DEPLOY_KEY" >"$RUNNER_TEMP/kenobi-preview-key"
          chmod 600 "$RUNNER_TEMP/kenobi-preview-key"

      - name: Deploy atomically to Kenobi
        if: steps.current.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          outer="$RUNNER_TEMP/preview-artifact.tar.gz"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -C artifact -czf "$outer" deployment.json release.tar.gz
          size="$(wc -c <"$outer" | tr -d ' ')"
          [[ "$size" =~ ^[1-9][0-9]*$ ]]
          ssh \
            -i "$RUNNER_TEMP/kenobi-preview-key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/.github/kenobi_known_hosts" \
            arknova-deploy@matrix.morpheum.dev \
            "deploy $PR_NUMBER $SOURCE_SHA $size" <"$outer"

      - name: Verify the public route
        if: steps.current.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          health="$(curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 30 "$PREVIEW_URL/healthz")"
          jq -e --arg sha "$SOURCE_SHA" \
            '.status == "ready" and .build.commit == $sha' <<<"$health" >/dev/null
          build="$(curl --fail --location --connect-timeout 10 --max-time 30 "$PREVIEW_URL/api/build")"
          jq -e --arg sha "$SOURCE_SHA" '.commit == $sha' <<<"$build" >/dev/null
          curl --fail --location --connect-timeout 10 --max-time 30 \
            --output /dev/null "$PREVIEW_URL/table"

      - name: Mark the deployment successful
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n \
            --arg environment_url "$PREVIEW_URL" \
            --arg log_url "$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: "success", environment_url: $environment_url, log_url: $log_url, auto_inactive: false}' \
            | gh api --method POST "repos/$REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" --input - >/dev/null

      - name: Update the sticky PR comment
        if: steps.current.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker='<!-- kenobi-preview -->'
          body="$(printf '%s\n\nPreview: [%s](%s)\n\nCommit: %s\n\nStatus: deployed successfully.' \
            "$marker" "$PREVIEW_URL" "$PREVIEW_URL" "$SOURCE_SHA")"
          comments="$(gh api --paginate --slurp "repos/$REPOSITORY/issues/$PR_NUMBER/comments")"
          comment_id="$(jq -r --arg marker "$marker" \
            '[.[][] | select(.body | contains($marker))][0].id // empty' <<<"$comments")"
          if [[ -n "$comment_id" ]]; then
            jq -n --arg body "$body" '{body: $body}' \
              | gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --input - >/dev/null
          else
            jq -n --arg body "$body" '{body: $body}' \
              | gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --input - >/dev/null
          fi

      - name: Mark a started deployment as failed
        if: failure() && steps.deployment.outputs.id != ''
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n \
            --arg environment_url "$PREVIEW_URL" \
            --arg log_url "$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state: "error", environment_url: $environment_url, log_url: $log_url, auto_inactive: false}' \
            | gh api --method POST "repos/$REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" --input - >/dev/null
